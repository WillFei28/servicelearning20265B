; ESP32-WROOM-32 38-pin DevKit on the ESP32S 38P Goouuu expansion board.
; Upload through the USB socket on the ESP32 module.
; The expansion board USB and DC jack only supply power.

[env:esp32dev]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
extra_scripts = pre:embed_crossing.py
lib_deps =
    earlephilhower/ESP8266Audio@1.9.7
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library@^1.11.11
