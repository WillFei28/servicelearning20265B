; ESP32-WROOM-32 38-pin DevKit on the ESP32S 38P Goouuu expansion board.
; Upload through the USB socket on the ESP32 module.
; The expansion board USB and DC jack only supply power.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
